# Bu projeyi GitHub'a yükleyince Windows ve Mac sürümlerini otomatik derler.
# Actions sekmesi > son çalışma > "Artifacts" bölümünden indirebilirsin.
name: Build AutoEdit
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg (Windows - uygulamaya gömülür)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
      - name: FFmpeg'i bin klasörüne kopyala (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          cp "$(which ffmpeg)" bin/ffmpeg.exe
          cp "$(which ffprobe)" bin/ffprobe.exe
      - name: Derle (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat
      - name: Derle (Mac)
        if: runner.os == 'macOS'
        run: ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AutoEdit-${{ runner.os }}
          path: AutoEdit-*.zip
